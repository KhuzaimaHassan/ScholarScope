[project]
name = "scholarscope"
version = "0.1.0"
description = "Evidence-first scholarship and graduate-program requirements research"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.13", "lxml>=5.3", "pypdf>=6.1", "pydantic>=2.12,<3", "tzdata", "jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4.4"]
render = ["playwright>=1.48"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scholarscope*"]

[tool.setuptools.package-data]
"scholarscope.extraction" = ["prompts/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "eval/snapshots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: optional Playwright/Chromium local-server rendering tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["scripts/create_issues\\.py"]
