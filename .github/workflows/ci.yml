name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install quality tools
        run: >-
          python -m pip install --upgrade pip ruff pytest mypy jsonschema
          httpx beautifulsoup4 lxml pypdf reportlab "pydantic>=2.12,<3" tzdata

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Type-check
        run: mypy .

  render-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional renderer and tests
        run: python -m pip install '.[render,test]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser contract tests (local loopback server only)
        run: pytest -q -m browser tests/test_renderer.py -rs
