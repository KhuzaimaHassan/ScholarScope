name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install quality tools
        run: >-
          python -m pip install --upgrade pip ruff pytest mypy jsonschema
          httpx beautifulsoup4 lxml pypdf reportlab

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Type-check
        run: mypy .
